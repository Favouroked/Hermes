<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hermes</title>
  <style>
    *{box-sizing:border-box} body{width:390px;min-height:300px;margin:0;padding:16px;background:#f5f7fb;font:14px system-ui;color:#172033}
    .card{background:#fff;border-radius:12px;padding:18px;box-shadow:0 3px 14px #18284818} h1{font-size:20px;margin:0 0 4px} h2{font-size:18px;margin:0 0 16px} p{color:#647084}.stack{display:grid;gap:10px}.nav{display:flex;gap:8px;margin-bottom:16px}.nav button{width:auto;padding:7px 11px;background:#eef2f8;color:#334}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px} label{font-weight:600;display:grid;gap:6px} input,select,textarea{width:100%;border:1px solid #d6dce6;border-radius:7px;padding:9px;font:inherit} textarea{min-height:80px;resize:vertical} button{border:0;border-radius:7px;padding:10px 12px;background:#2864dc;color:white;font-weight:650;cursor:pointer} button.secondary{background:#eef2f8;color:#334} button.danger{background:#c93636}.link{display:block;width:100%;text-align:left;background:#f1f5fb;color:#1c4ea8}.status{padding:9px;border-radius:7px;background:#eef7ff;color:#165b93}.error{background:#fff0f0;color:#a52828}.hidden{display:none}.muted{font-size:12px;color:#718096;word-break:break-all}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.result{padding:8px 0;border-bottom:1px solid #e8ebf0;word-break:break-all;font-size:12px}
  </style>
</head>
<body><main class="card"><div id="app"></div></main><script src="popup.js"></script></body>
</html>
