[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-job-tools"
version = "0.1.0"
description = "Hermes job search and cover-letter CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.16",
    "openai>=1.102",
    "pydantic>=2.11",
    "pyperclip>=1.9",
    "requests>=2.32",
    "SQLAlchemy>=2.0",
]

[project.scripts]
hermes = "src.cli:main"

[tool.setuptools.packages.find]
include = ["src*"]
